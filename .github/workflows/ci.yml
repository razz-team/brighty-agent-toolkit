name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, large]
    env:
      NPM_GITHUB_TOKEN: you-dont-need-this
      CI: true
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: update .yarnrc.yml for GitHub Packages auth
        run: |
          yarn config set 'npmRegistries["//npm.pkg.github.com"].npmAuthToken' '${NPM_GITHUB_TOKEN}'

      - name: install
        run: yarn install --immutable
        env:
          NPM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: validate plugin manifest
        run: yarn validate-plugin

      - name: validate AgentSkills
        run: yarn validate

      - name: cross-reference skills <-> MCP tools
        run: yarn check-tools

      - name: lint
        run: yarn lint

      - name: format check
        run: yarn format:check

      - name: build
        run: yarn build

      - name: test
        run: yarn test

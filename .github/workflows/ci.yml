name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"

      - name: enable corepack
        run: corepack enable

      - name: resolve yarn cache path
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: cache yarn
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: install
        run: yarn install --immutable

      - name: validate plugin manifest
        run: yarn validate-plugin

      - name: validate AgentSkills
        run: yarn validate

      - name: cross-reference skills <-> MCP tools
        run: yarn check-tools

      - name: lint
        run: yarn lint

      - name: format check
        run: yarn format:check

      - name: build
        run: yarn build

      - name: test
        run: yarn test

name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: enable corepack
        run: corepack enable

      - name: install
        run: yarn install --immutable

      - name: validate plugin manifest
        run: yarn validate-plugin

      - name: validate AgentSkills
        run: yarn validate

      - name: cross-reference skills <-> MCP tools
        run: yarn check-tools

      - name: lint
        run: yarn lint

      - name: format check
        run: yarn format:check

      - name: build
        run: yarn build

      - name: test
        run: yarn test

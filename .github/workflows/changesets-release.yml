name: changesets-release

# Two-mode workflow:
#
# 1. Push to master with queued changesets present →
#    open or update a "version packages" PR. The PR bumps versions,
#    updates CHANGELOG.md, and runs scripts/sync-versions.mjs to
#    propagate the bump to .mcp.json / plugin.json / SERVER_VERSION /
#    skills.
#
# 2. Push to master AFTER the version-packages PR merges (no
#    changesets pending, but bumped package.json) →
#    `yarn release` builds the package, runs `changeset publish`
#    which calls `npm publish --provenance --access public` per
#    bumped package and creates the matching git tag.
#
# Both modes are handled by the same `changesets/action@v1` step
# based on whether changeset files are present or not.

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance via OIDC trusted publisher

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, large]
    env:
      CI: true
      # Tells `npm publish` (called by `changeset publish`) to attach a
      # provenance statement. Requires id-token: write permission above
      # and the workflow filename to be registered as the trusted
      # publisher for @brighty-app/mcp-server on npmjs.com.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: install
        run: yarn install --immutable

      - name: open version PR or publish
        uses: changesets/action@v1
        with:
          version: yarn version
          publish: yarn release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

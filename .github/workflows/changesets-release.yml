name: changesets-release

# Opens a "Version Packages" PR that bumps versions, updates
# CHANGELOG.md, and runs scripts/sync-versions.mjs to propagate the
# bump to .mcp.json / plugin.json / SERVER_VERSION / skills. The PR is
# *not* the publish event — when it lands on master, the maintainer
# tags the resulting commit (mcp-server-v<version>) and pushes the tag,
# which triggers release-mcp.yml to do the actual `npm publish
# --provenance`. This split keeps provenance attestation tied to the
# tag-and-publish moment instead of the version-bump moment.

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: [self-hosted, Linux, X64, large]
    env:
      CI: true
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: install
        run: yarn install --immutable

      - name: open or update version-packages PR
        uses: changesets/action@v1
        with:
          # `version` runs `yarn version` per package.json scripts,
          # which is `changeset version && node scripts/sync-versions.mjs`.
          version: yarn version
          # Do NOT publish from this workflow — release-mcp.yml owns that
          # via tag push.
          publish: ""
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
